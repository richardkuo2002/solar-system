<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solar System</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- v1.11.3 risk audit — was an inline <script type="importmap"> with the
       JSON written directly in the tag. src-tauri/tauri.conf.json's CSP is
       `script-src 'self'` (no 'unsafe-inline', no nonce/hash), which governs
       import maps the same as any other <script> — an inline one silently
       never registers under that policy, so every `import ... from 'three'`
       would fail and the Tauri bundle wouldn't boot. An external, same-
       origin file is covered by 'self' like any other script asset. -->
  <script type="importmap" src="importmap.json"></script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="ui-root"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
