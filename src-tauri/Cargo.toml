[package]
name = "app"
version = "0.1.0"
# v1.11.3 risk audit — description/authors/license were the unedited
# `tauri create` scaffold defaults ("A Tauri App"/["you"]/""); filled in to
# match package.json and LICENSE. `repository` left blank — no public repo
# URL exists to put here (this doesn't affect a local build either way).
description = "Interactive 3D solar system simulation (Three.js, browser-only, zero-build) — Tauri desktop shell"
authors = ["Richard Kuo"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
